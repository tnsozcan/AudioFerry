name: Feature request
description: Suggest a focused improvement to AudioFerry
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Thanks for proposing an improvement. Please explain the user problem before describing a particular implementation.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
        - label: This request is related to AudioFerry's Windows-to-AirPlay audio workflow.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what currently makes it difficult?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the behavior you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workarounds or alternative designs you tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or compatibility details if useful.
